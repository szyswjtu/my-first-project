<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>知识问答系统 V1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧠 知识问答系统</h1>
        <div class="search-box">
            <input type="text" id="questionInput" placeholder="请输入你的问题（例如：Git是什么？）">
            <button onclick="searchAnswer()">提问</button>
        </div>
        <div id="answerBox" class="answer-box">
            等待你的提问...
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
